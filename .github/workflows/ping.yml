name: Ping da API

# Mantém a API do Render acordada e confere o banco de vez em quando (#23).
#
#   a cada 10 min  GET /        não toca no banco: o Neon pode desligar
#   a cada 6 h     GET /saude   acorda o banco e testa; falha se não vier 200
#
# Por que não chamar a /saude a cada 10 min: ela consulta o banco, e o Neon
# nunca desligaria. As horas gratuitas do mês acabariam (docs/deploy.md).
#
# Agendamentos só rodam a partir da main, em UTC, e o GitHub pode atrasá-los
# alguns minutos. "Run workflow" (na aba Actions) roda os dois na hora.

on:
  schedule:
    - cron: "*/10 * * * *"
    - cron: "7 */6 * * *"
  workflow_dispatch:

permissions: {}

env:
  # Endereço público da API no Render (não é segredo).
  API_URL: https://cityshield-s2lq.onrender.com

jobs:
  acordada:
    name: API acordada (GET /)
    if: github.event.schedule != '7 */6 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Endereço da API preenchido?
        id: url
        run: |
          if [[ "$API_URL" == *PREENCHER-DEPOIS-DO-DEPLOY* ]]; then
            echo "::notice::API_URL ainda é o marcador: nada a fazer até o deploy."
            echo "pronto=nao" >> "$GITHUB_OUTPUT"
          else
            echo "pronto=sim" >> "$GITHUB_OUTPUT"
          fi

      # O Render leva ~1 min para acordar: até 4 novas tentativas, 20 s entre elas.
      - name: GET /
        if: steps.url.outputs.pronto == 'sim'
        run: |
          curl --fail --silent --show-error \
            --retry 4 --retry-delay 20 --retry-all-errors --max-time 90 \
            "$API_URL/"
          echo

  saude:
    name: API e banco (GET /saude)
    if: github.event.schedule == '7 */6 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Endereço da API preenchido?
        id: url
        run: |
          if [[ "$API_URL" == *PREENCHER-DEPOIS-DO-DEPLOY* ]]; then
            echo "::notice::API_URL ainda é o marcador: nada a fazer até o deploy."
            echo "pronto=nao" >> "$GITHUB_OUTPUT"
          else
            echo "pronto=sim" >> "$GITHUB_OUTPUT"
          fi

      - name: GET /saude tem que dar 200
        if: steps.url.outputs.pronto == 'sim'
        run: |
          codigo=$(curl --silent --show-error \
            --retry 4 --retry-delay 20 --retry-all-errors --max-time 90 \
            --output resposta.json --write-out '%{http_code}' \
            "$API_URL/saude" || true)
          cat resposta.json 2>/dev/null; echo
          if [ "$codigo" != "200" ]; then
            echo "::error::/saude respondeu $codigo (esperado 200): API ou banco fora do ar."
            exit 1
          fi
