name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  padrao:
    name: Padrão do time
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Nada de dados privados, .env ou rasters
        run: |
          proibidos=$(git ls-files | grep -E '^dados_privados/|(^|/)\.env$|\.tiff?$' || true)
          if [ -n "$proibidos" ]; then
            echo "Arquivos que não podem ir para o repositório:"
            echo "$proibidos"
            exit 1
          fi

      - name: Título do PR no padrão
        if: github.event_name == 'pull_request'
        env:
          TITULO: ${{ github.event.pull_request.title }}
        run: |
          if ! echo "$TITULO" | grep -Eq '^(feat|fix|docs|style|refactor|test|data|chore)(\((pipeline|api|web|docs|db|infra)\))?: .+'; then
            echo "Título fora do padrão: $TITULO"
            echo "Use: tipo(escopo): descrição   (veja CONTRIBUTING.md)"
            exit 1
          fi

  python:
    name: Python (lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check pipeline api db --select E9,F63,F7,F82

  testes:
    name: Python (testes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # a mesma da imagem da api
          cache: pip
          cache-dependency-path: api/requirements*.txt
      # As dependências da api servem para os dois: a carga usa SQLAlchemy e psycopg.
      - run: pip install -r api/requirements-dev.txt
      # Nenhum dos dois precisa de banco: a carga testa a leitura dos arquivos
      # de docs/dados/, e a api aponta para uma porta sem banco (conftest.py).
      - name: pytest da carga (db/)
        working-directory: db
        run: python -m pytest -q
      - name: pytest da api (api/)
        working-directory: api
        run: python -m pytest -q

  site:
    name: Site (navegador)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/site/requirements.txt
      - run: pip install -r tests/site/requirements.txt
      - run: python -m playwright install --with-deps chromium
      # Abre docs/mapa.html no Chromium (computador e celular 390x844) e falha
      # com qualquer erro no console ou exceção na página.
      - run: python -m pytest -q tests/site
