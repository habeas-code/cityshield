name: CI

on:
  pull_request:
  push:
    branches: [main]

# Versões fixas: ubuntu-24.04 (não "latest", que muda sozinho) e actions com Node 24
# (checkout@v7, setup-python@v7). Atualizar de propósito, num PR.
jobs:
  padrao:
    name: Padrão do time
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Nada de dados privados, .env ou rasters
        run: |
          proibidos=$(git ls-files | grep -E '^dados_privados/|(^|/)\.env$|\.tiff?$' || true)
          if [ -n "$proibidos" ]; then
            echo "Arquivos que não podem ir para o repositório:"
            echo "$proibidos"
            exit 1
          fi

      - name: Título do PR no padrão
        if: github.event_name == 'pull_request'
        env:
          TITULO: ${{ github.event.pull_request.title }}
        run: |
          if ! echo "$TITULO" | grep -Eq '^(feat|fix|docs|style|refactor|test|data|chore)(\((pipeline|api|web|docs|db|infra)\))?: .+'; then
            echo "Título fora do padrão: $TITULO"
            echo "Use: tipo(escopo): descrição   (veja CONTRIBUTING.md)"
            exit 1
          fi

  python:
    name: Python (lint)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check pipeline api db --select E9,F63,F7,F82

  testes:
    name: Python (testes)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"   # a mesma da imagem da api
          cache: pip
          cache-dependency-path: api/requirements*.txt
      # As dependências da api servem para os dois: a carga usa SQLAlchemy e psycopg.
      - run: pip install -r api/requirements-dev.txt
      # Nenhum dos dois precisa de banco: a carga testa a leitura dos arquivos
      # de docs/dados/, e a api aponta para uma porta sem banco (conftest.py).
      - name: pytest da carga (db/)
        working-directory: db
        run: python -m pytest -q
      - name: pytest da api (api/)
        working-directory: api
        run: python -m pytest -q

  pipeline:
    name: Pipeline (testes)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"   # a mesma da imagem do pipeline
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt pytest==9.2.0
      # Só as contas (volumes, alertas, sensibilidade, nomes de rua), com dados
      # montados nos testes: não baixa nada e não roda o pipeline inteiro.
      - name: pytest do pipeline
        working-directory: pipeline
        run: python -m pytest -q

  site:
    name: Site (navegador)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/site/requirements.txt
      - run: pip install -r tests/site/requirements.txt
      - run: python -m playwright install --with-deps chromium
      # Abre docs/mapa.html no Chromium (computador e celular 390x844) e falha
      # com qualquer erro no console ou exceção na página.
      - run: python -m pytest -q tests/site

  banco:
    name: Banco de verdade (PostGIS)
    runs-on: ubuntu-24.04
    # Um PostGIS de verdade, a mesma imagem do docker-compose.yml. Usuário e
    # senha só existem aqui dentro, como os do .env.example: não são segredo.
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: cityshield
          POSTGRES_USER: cityshield
          POSTGRES_PASSWORD: cityshield
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U cityshield -d cityshield"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGUSER: cityshield
      PGPASSWORD: cityshield
      PGDATABASE: cityshield
      DATABASE_URL: postgresql+psycopg://cityshield:cityshield@127.0.0.1:5432/cityshield
      SENHA_API: senha-so-do-ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"   # a mesma da imagem da api
          cache: pip
          cache-dependency-path: api/requirements*.txt
      - run: pip install -r api/requirements-dev.txt

      # O service não monta pastas do repositório: aplica db/init/ aqui, na
      # ordem, como o Docker faz sozinho no docker compose.
      - name: Aplica db/init/
        run: |
          for arquivo in db/init/*.sql; do
            echo "== $arquivo"
            psql -v ON_ERROR_STOP=1 -q -f "$arquivo"
          done

      # Rodar de novo tem que dar o mesmo resultado (db/carga.py).
      - name: Carga duas vezes, com as mesmas contagens
        run: |
          primeira=$(python db/carga.py)
          echo "1ª: $primeira"
          segunda=$(python db/carga.py)
          echo "2ª: $segunda"
          if [ "$primeira" != "$segunda" ]; then
            echo "As duas cargas deram contagens diferentes."
            exit 1
          fi

      # O SQL vem do docs/deploy.md (seção 3), não de uma cópia: se o guia
      # mudar, o CI testa o guia novo. Sem o bloco, o passo falha e diz por quê.
      - name: Cria o cityshield_api com o SQL do guia
        run: python tests/banco/usuario_api.py

      - name: Rotas com o cityshield_api e permissões
        env:
          URL_API: postgresql+psycopg://cityshield_api:senha-so-do-ci@127.0.0.1:5432/cityshield
          URL_DONO: postgresql+psycopg://cityshield:cityshield@127.0.0.1:5432/cityshield
        run: python -m pytest -q tests/banco
