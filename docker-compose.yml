services:
  db:
    image: postgis/postgis:16-3.4
    env_file: .env
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  api:
    build: ./api
    env_file: .env
    depends_on:
      db: { condition: service_healthy }
    ports: ["8000:8000"]
    volumes: ["./api:/app"]
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  pipeline:
    build: ./pipeline
    profiles: ["tools"]   # não sobe com "docker compose up"; rode com "docker compose run --rm pipeline"
    env_file: .env
    depends_on:
      db: { condition: service_healthy }
    volumes:
      - ./pipeline:/app
      - ./dados_privados:/dados_privados:ro
      - ./web/public/dados:/saida
    command: python -m pipeline

volumes:
  dbdata:
