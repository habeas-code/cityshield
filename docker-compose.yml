services:
  db:
    image: postgis/postgis:16-3.4
    env_file: .env
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports: ["5432:5432"]
    healthcheck:
      # -h 127.0.0.1: testa pela rede. Enquanto roda db/init/, o Postgres sobe
      # um servidor temporário só local; sem -h ele já pareceria pronto e a
      # carga tentaria conectar antes da hora.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  # Grava as camadas de docs/dados/ no banco (db/carga.py) e termina.
  # Usa a imagem da api (já tem SQLAlchemy e psycopg). Só lê os arquivos
  # públicos; dados_privados/ não é montado aqui.
  carga:
    build: ./api
    env_file: .env
    depends_on:
      db: { condition: service_healthy }
    volumes:
      - ./db:/db:ro
      - ./docs/dados:/docs/dados:ro
    command: python /db/carga.py

  api:
    build: ./api
    env_file: .env
    depends_on:
      db: { condition: service_healthy }
      carga: { condition: service_completed_successfully }  # só sobe com as camadas no banco
    ports: ["8000:8000"]
    volumes:
      - ./api:/app
      # Só para rodar o pytest dentro do container: os testes do cenário
      # conferem a conta com docs/dados/recomendacoes.geojson. A API não lê.
      - ./docs/dados:/docs/dados:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  pipeline:
    build: ./pipeline
    profiles: ["tools"]   # não sobe com "docker compose up"; rode com "docker compose run --rm pipeline"
    env_file: .env
    depends_on:
      db: { condition: service_healthy }
    volumes:
      - ./pipeline:/app
      - ./dados_privados:/dados_privados:ro
      - ./web/public/dados:/saida
      - ./docs/dados:/referencia:ro
    command: python -m pipeline

volumes:
  dbdata:
